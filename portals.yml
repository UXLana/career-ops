    enabled: true

  - name: Samsara
    careers_url: https://www.samsara.com/company/careers
    scan_method: playwright
    notes: Complex operations workflows and regulated industries.
    enabled: true

  - name: Toast
    careers_url: https://careers.toasttab.com/
    scan_method: playwright
    notes: Complex SMB/operations workflows.
    enabled: true
