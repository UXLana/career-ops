# Lana career-ops scanner seed config.
# Expand this after the first calibration pass.

title_filter:
  positive:
    - "Director of UX"
    - "Director, UX"
    - "Head of Design"
    - "Head of UX"
    - "Design Systems"
    - "Design System"
    - "Principal Product Designer"
    - "Lead Product Designer"
    - "Senior UX Design Lead"
    - "Design Operations"
    - "DesignOps"
    - "Accessibility"
    - "Inclusive Design"
    - "AI Design"
    - "UX Research Operations"
  negative:
    - "Graphic Designer"
    - "Brand Designer"
    - "Marketing Designer"
    - "Intern"
    - "Junior"
    - "Visual Designer"

queries:
  - name: "Design Systems Leadership"
    query: "\"design systems\" (director OR lead OR principal) product design remote"
  - name: "Accessibility Product Design"
    query: "\"accessibility\" \"product design\" (lead OR principal OR director) remote"
  - name: "GovTech UX Leadership"
    query: "(govtech OR civic OR government) \"UX\" (lead OR director OR principal) remote"
  - name: "RegTech UX Leadership"
    query: "(regtech OR compliance) \"product design\" (lead OR director OR principal) remote"
  - name: "AI Design Operations"
    query: "\"AI\" \"design operations\" OR \"design systems\" remote"

